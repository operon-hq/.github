name: Update Organization Readme Badges

on:
  schedule:
    - cron: '0 7 * * *' # runs daily at 07:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-badges:
    runs-on: ubuntu-latest

    steps:
      # 1. Generate the token FIRST so that the checkout can use it
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # 2. Checkout configured with the GitHub App token
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: organization-readme-badge-generator
        id: badges
        uses: operon-hq/action-organization-readme-badges@v1.0.0-alpha
        with:
          badges: repositories,prs-created,prs-merged,merge-rate,open-issues,releases,contributors,stars,forks,default-branch-status,updated
          section_title: Organization metrics
      - if: steps.badges.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md
          git commit -m 'docs: refresh metrics'
          git push

      # - name: organization-readme-badge-generator
      #   id: organization-readme-badge-generator
      #   uses: joshjohanning/organization-readme-badge-generator@v2
      #   with:
      #     organization: ${{ github.repository_owner }}
      #     token: ${{ steps.app-token.outputs.token }}
      #     color: blue
      #     label_color: 333

      - name: Write to job summary
        run: |
          echo "${{ steps.organization-readme-badge-generator.outputs.badges }}" >> $GITHUB_STEP_SUMMARY

